<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Baraja Española - Lectura de Cartas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>🔮 Baraja Española</h1>
    <p>Descubre lo que las cartas tienen para ti</p>
  </header>

  <div class="controles">
    <div class="control-grupo">
      <label for="select-tirada">Selecciona tu tirada:</label>
      <select id="select-tirada">
        <option value="respuestaRapida">Respuesta Rápida (3 cartas)</option>
        <option value="cruzDelConsejo">Cruz del Consejo (5 cartas)</option>
        <option value="pasadoPresenteFuturo">Pasado Presente Futuro (7 cartas)</option>
        <option value="lecturaDelPensamiento">Lectura del Pensamiento (12 cartas)</option>
      </select>
      <div id="descripcion-tirada" class="descripcion-tirada">
        Tirada simple de 3 cartas para una respuesta directa
      </div>
    </div>
    
    <button id="btn-realizar-tirada">🎴 Barajar y Sacar Cartas</button>
  </div>

  <div class="layout-principal">
    <div class="area-tirada">
      <div id="contenedor-tirada" class="contenedor-tirada">
        <p class="hint">Selecciona una tirada y presiona el botón para comenzar</p>
      </div>
    </div>

    <div id="panel-significados" class="panel-significados">
      <h2>Significados</h2>
      <p class="hint">Haz clic en una carta para ver su significado</p>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal oculto">
    <div class="modal-contenido">
      <button id="btn-cerrar-modal" class="btn-cerrar">&times;</button>
      <h2 id="modal-titulo"></h2>
      <div id="modal-contenido"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast oculto">
    <span id="toast-mensaje"></span>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/significados.js"></script>
  <script src="js/tiradas.js"></script>
  <script src="js/barajar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
